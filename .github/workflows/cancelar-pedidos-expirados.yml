name: Cancelamento automático de pedidos expirados

on:
  schedule:
    # A cada hora, no minuto 0. A RPC e' idempotente e autolimitada
    # (so cancela pedido que ja passou do prazo configurado por
    # tenant - migration 039, REGRAS_DE_NEGOCIO.md §17.2) - rodar
    # cedo ou repetido nao tem efeito colateral, entao uma janela de
    # ate 1h de atraso pra pegar um pedido vencido e' aceitavel dado
    # que o prazo default e' de 48h.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  cancelar-expirados:
    runs-on: ubuntu-latest
    steps:
      # Incremento 8 (Notificacoes, 25/08/2026): a RPC
      # cancelar_pedidos_expirados() (migration 042) deixou de ser
      # chamavel por anon key - agora devolve os pedidos afetados
      # (nao so' a contagem) e por isso e' service-role-only. Este
      # step passou a chamar a rota do Next.js (que usa service role
      # internamente e notifica cada cliente), nao mais a RPC direto
      # via REST.
      - name: Chamar /api/cron/notificar-cancelamentos
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "${APP_URL}/api/cron/notificar-cancelamentos" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP Status: ${STATUS}"
          echo "Resumo: ${BODY}"

          if [ "$STATUS" -ne 200 ]; then
            echo "::error::notificar-cancelamentos falhou (HTTP ${STATUS})"
            exit 1
          fi
